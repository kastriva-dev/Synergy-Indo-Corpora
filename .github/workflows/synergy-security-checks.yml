name: Synergy CMS Checks

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build uses demo fallback only; no production GAS or OAuth secrets.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
